events {
    worker_connections 1024;
}

http {
    # Capture only the product-search query parameter.
    map "$request_method:$uri" $search_query {
        default "";
        "GET:/rest/products/search" $arg_q;
    }

    # Limit captured evidence to 2048 characters.
    map $search_query $query_evidence {
        default "";
        "~^(?<bounded_query>.{0,2048})" $bounded_query;
    }

    # Indicate whether the captured value was truncated.
    map $search_query $query_truncated {
        default false;
        "~^.{2049}" true;
    }

    log_format autoshield escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query_evidence":"$query_evidence",'
        '"query_truncated":$query_truncated,'
        '"status":$status,'
        '"upstream_status":"$upstream_status",'
        '"duration_seconds":$request_time}';

    access_log /var/log/nginx/autoshield.jsonl autoshield;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Request-ID $request_id always;

        location = /proxy-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"autoshield-proxy"}';
        }

        location / {
            proxy_pass http://juice-shop:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}