services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - ./.env
    environment:
      ARMORIQ_API_KEY: ${ARMORIQ_API_KEY:-}
      AUTOSHIELD_LAB_ORIGINS: ${AUTOSHIELD_LAB_ORIGINS:-http://proxy}
    volumes:
      - proxy_logs:/logs:ro
      - backend_data:/app/data
      - ./deployment:/deployment:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  juice-shop:
    image: bkimminich/juice-shop:v20.2.0
    networks:
      - lab
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "require('http').get('http://127.0.0.1:3000/', r => {r.resume(); process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - proxy_logs:/var/log/nginx
    depends_on:
      juice-shop:
        condition: service_healthy
    networks:
      - default
      - lab
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/proxy-health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  staging-waf:
    image: "owasp/modsecurity-crs@sha256:1cf0a567e88e3b71862a3bc009dcc28ee620971cc672aa564872a3052edb5680"
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      BACKEND: http://juice-shop:3000
      SERVER_NAME: localhost
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
    depends_on:
      juice-shop:
        condition: service_healthy
    networks:
      - default
      - lab

  candidate-waf:
    image: "owasp/modsecurity-crs@sha256:1cf0a567e88e3b71862a3bc009dcc28ee620971cc672aa564872a3052edb5680"
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      BACKEND: http://juice-shop:3000
      SERVER_NAME: localhost
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
    volumes:
      - type: bind
        source: ./candidate/autoshield.conf
        target: /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      juice-shop:
        condition: service_healthy
    networks:
      - default
      - lab

  enforcement-waf:
    image: "owasp/modsecurity-crs@sha256:1cf0a567e88e3b71862a3bc009dcc28ee620971cc672aa564872a3052edb5680"
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      BACKEND: http://juice-shop:3000
      SERVER_NAME: localhost
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
    volumes:
      - type: bind
        source: ./deployment
        target: /opt/autoshield
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deployment/include.conf
        target: /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      juice-shop:
        condition: service_healthy
    networks:
      - default
      - lab

networks:
  lab:
    internal: true

volumes:
  proxy_logs:
  backend_data:
