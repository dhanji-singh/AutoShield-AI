server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $scanner http://backend:8000;
    set $gateway http://mcp-gateway:8011;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /api/health { proxy_pass $scanner/health; }
    location ~ ^/api/(scans(?:/.*)?)$ { proxy_pass $scanner/$1$is_args$args; proxy_read_timeout 60s; }
    location /api/mcp/ {
        proxy_pass $gateway$request_uri;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
